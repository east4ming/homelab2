apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "{{ .Release.Name }}-secret"
  namespace: "{{ .Release.Namespace }}"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  # 只取本应用要用的四把钥匙，不用 dataFrom 把整个 external Secret 拉进来。
  data:
    # acme.sh 的 dns_tencent 直接读这两个环境变量
    - secretKey: Tencent_SecretId
      remoteRef:
        key: external
        property: acme-ewhisper-tencent-secret-id
    - secretKey: Tencent_SecretKey
      remoteRef:
        key: external
        property: acme-ewhisper-tencent-secret-key
    - secretKey: QINIU_ACCESS_KEY
      remoteRef:
        key: external
        property: acme-ewhisper-qiniu-access-key
    - secretKey: QINIU_SECRET_KEY
      remoteRef:
        key: external
        property: acme-ewhisper-qiniu-secret-key
