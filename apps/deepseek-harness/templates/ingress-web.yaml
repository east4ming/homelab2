apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "deepseek-harness.fullname" . }}
  labels:
    {{- include "deepseek-harness.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.web.host | quote }}
  rules:
    - host: {{ .Values.ingress.web.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "deepseek-harness.fullname" . }}-tailscale
                port:
                  name: http
          - path: /novnc-
            pathType: Prefix
            backend:
              service:
                name: {{ include "deepseek-harness.fullname" . }}-tailscale
                port:
                  name: desktop
