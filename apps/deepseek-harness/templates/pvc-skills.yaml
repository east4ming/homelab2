apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "deepseek-harness.fullname" . }}-skills
  labels:
    {{- include "deepseek-harness.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.skills.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.skills.size }}
