when:
  branch: ${CI_REPO_DEFAULT_BRANCH}

matrix:
  STACK:
    - system
    - platform
    - apps

steps:
  diff:
    image: ghcr.io/east4ming/homelab2-ci:latest
    pull: true
    commands:
      - ./scripts/helm-diff --repository "${CI_REPO_CLONE_URL}" --source "${CI_COMMIT_SOURCE_BRANCH}" --target "${CI_COMMIT_TARGET_BRANCH}" --subpath "${STACK}"
    when:
      - event: pull_request
        path: '${STACK}/**'
    depends_on: []
