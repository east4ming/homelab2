when:
  branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  pre-commit:
    image: ghcr.io/east4ming/homelab2-ci:latest
    pull: true
    commands:
      # Go/ansible/opentofu 已从 CI 镜像移除：
      # - 不运行 TestToolsVersions（需要 Go）
      # - 跳过依赖 opentofu 的 tofu_fmt（本地 pre-commit 仍会执行）
      # --all-files: without it pre-commit only checks staged files and passes
      # vacuously on a fresh CI clone
      - SKIP=tofu_fmt pre-commit run --all-files --color=always
    when:
      - event: pull_request
    depends_on: []
