when:
  branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  tools-versions:
    image: ghcr.io/east4ming/homelab2-ci:latest
    pull: true
    commands:
      # TestToolsVersions（9 个工具）+ TestToolsDevEnv（mise/uv 环境）
      - make -C test filter=Tools
    when:
      - event: pull_request
        path:
          include:
            - '.mise.toml'
            - 'pyproject.toml'
            - 'uv.lock'
            - '.woodpecker/ci/**'
            - 'test/**'
    depends_on: []
  pre-commit:
    image: ghcr.io/east4ming/homelab2-ci:latest
    pull: true
    commands:
      # --all-files: without it pre-commit only checks staged files and passes
      # vacuously on a fresh CI clone
      - pre-commit run --all-files --color=always
    when:
      - event: pull_request
    depends_on: []
