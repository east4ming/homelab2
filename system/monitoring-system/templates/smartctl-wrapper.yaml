apiVersion: v1
kind: ConfigMap
metadata:
  name: smartctl-wrapper
  namespace: {{ .Release.Namespace }}
data:
  smartctl: |
    #!/bin/sh
    # Retry only the known NVMe error-log compatibility issue:
    # some drives fail to read the default 16 error-log entries with
    # "PRP Offset Invalid (0x013)" / exit status 4, but work with 64 entries.
    #
    # Normal drives are executed exactly as before, so this wrapper does not
    # change their behavior. Only when the original smartctl output contains
    # "PRP Offset Invalid" do we retry with --log=error,64.
    REAL=/usr/sbin/smartctl

    tmp="$(mktemp /tmp/smartctl-wrapper.XXXXXX)" || exit 1

    "$REAL" "$@" >"$tmp" 2>/dev/null
    status=$?

    if [ "$status" -eq 0 ]; then
      cat "$tmp"
      rm -f "$tmp"
      exit 0
    fi

    if ! grep -q "PRP Offset Invalid" "$tmp"; then
      cat "$tmp"
      rm -f "$tmp"
      exit "$status"
    fi

    for arg in "$@"; do
      if [ "$arg" = "--log=error" ]; then
        set -- "$@" "--log=error,64"
      else
        set -- "$@" "$arg"
      fi
      shift
    done

    retry_tmp="$tmp.retry"
    "$REAL" "$@" >"$retry_tmp" 2>/dev/null
    retry_status=$?
    if [ "$retry_status" -eq 0 ]; then
      cat "$retry_tmp"
      rm -f "$tmp" "$retry_tmp"
      exit 0
    fi

    cat "$tmp"
    rm -f "$tmp" "$retry_tmp"
    exit "$status"
