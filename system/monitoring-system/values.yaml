kube-prometheus-stack:
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
  prometheus:
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi
      resources:
        requests:
          cpu: 160m
          memory: 3968Mi
        limits:
          memory: 5Gi
    ingress:
      enabled: true
      ingressClassName: tailscale
      annotations:
        tailscale.com/proxy-group: ingress-proxies
      hosts:
        - prometheus.west-beta.ts.net
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - prometheus.west-beta.ts.net
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 1m
          memory: 25Mi
        limits:
          memory: 50Mi
  alertmanager:
    alertmanagerSpec:
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Mi
      resources:
        requests:
          cpu: 2m
          memory: 35Mi
        limits:
          memory: 70Mi
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "robusta"
            group_by: ["..."]
            group_wait: 1s
            group_interval: 1s
            matchers:
              - severity =~ ".*"
            continue: true
          - receiver: ntfy
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
        - name: "robusta"
          webhook_configs:
            - url: "http://robusta-runner.default.svc.cluster.local/api/alerts"
              send_resolved: true
    ingress:
      enabled: true
      ingressClassName: tailscale
      annotations:
        tailscale.com/proxy-group: ingress-proxies
      hosts:
        - alertmanager.west-beta.ts.net
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - alertmanager.west-beta.ts.net

    prometheusConfigReloader:
      resources:
        requests:
          cpu: 1m
          memory: 21Mi
        limits:
          memory: 42Mi
  defaultRules:
    rules:
      kubeProxy: false
  kubeApiServer:
    enabled: true
  kubeControllerManager:
    enabled: true
    # TODO: fix hardcoded IPs
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
  kubeScheduler:
    enabled: true
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: true
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
    service:
      enabled: true
      port: 2381
      targetPort: 2381
  prometheusOperator:
    resources:
      requests:
        cpu: 3m
        memory: 107Mi
      limits:
        memory: 214Mi
  kubeStateMetrics:
    resources:
      requests:
        cpu: 5m
        memory: 42Mi
      limits:
        memory: 84Mi
  nodeExporter:
    resources:
      requests:
        cpu: 5m
        memory: 39Mi
      limits:
        memory: 80Mi
prometheus-smartctl-exporter:
  common:
    config:
      # Use a wrapper that only retries the known NVMe error-log bug.
      # Some drives (e.g. ZHITAI TiPro7000) fail with PRP Offset Invalid when
      # smartmontools reads the default 16 error-log entries; the wrapper
      # retries with --log=error,64 only for that specific failure.
      smartctl_location: /opt/smartctl-wrapper/smartctl
  extraVolumes:
    - name: smartctl-wrapper
      configMap:
        name: smartctl-wrapper
        defaultMode: 0755
  extraVolumeMounts:
    - name: smartctl-wrapper
      mountPath: /opt/smartctl-wrapper
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s
  prometheusRules:
    enabled: true
  rbac:
    # The chart default RoleBinding references the unrestricted-psp ClusterRole,
    # which is not guaranteed to exist on modern K3s. The exporter does not need
    # Kubernetes API access, so RBAC is disabled.
    create: false
  service:
    port: 9633
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 64Mi
