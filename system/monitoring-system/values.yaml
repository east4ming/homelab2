kube-prometheus-stack:
  grafana:
    enabled: false
    forceDeployDatasources: true
    forceDeployDashboards: true
  prometheus:
    # IPv4/IPv6 双栈。templates/prometheus/service.yaml 的整块被
    # `if .Values.prometheus.service.ipDualStack.enabled` 门住，所以 enabled
    # 必须显式打开；ipFamilies 也必须显式写成 IPv4 在前——chart 默认是
    # ["IPv6","IPv4"]，而 ipFamilies 不可变，线上是 IPv4-only 原地转换来的
    # （主族仍是 IPv4），写成 IPv6 在前会被 apiserver 拒绝。
    service:
      ipDualStack:
        enabled: true
        ipFamilies: ["IPv4", "IPv6"]
        ipFamilyPolicy: PreferDualStack
    prometheusSpec:
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      # Tailscale client metrics from the 4 nodes (tailscale-metrics.service,
      # read-only listener on 5252). Nodes are scraped over the LAN IP, the same
      # way node-exporter is scraped. Keeping the targets here means they are
      # tracked in Git alongside metal/inventories/prod.yml.
      additionalScrapeConfigs:
        - job_name: tailscale-nodes
          scrape_interval: 60s
          scrape_timeout: 10s
          static_configs:
            - targets: ["192.168.3.226:5252"]
              labels:
                node: n100-jumper-0
            - targets: ["192.168.3.174:5252"]
              labels:
                node: n100-jumper-1
            - targets: ["192.168.3.158:5252"]
              labels:
                node: n100-jumper-2
            - targets: ["192.168.3.154:5252"]
              labels:
                node: n100-cheshi-0
            - targets: ["192.168.3.246:5252"]
              labels:
                node: casey-desktop
        # QNAP NAS (NAS33657A). The two exporters run as Container Station
        # applications there; metal/nas/compose.yml is the source of truth for
        # them, and this job assumes it has been imported.
        #
        # The four SATA bays sit behind a controller that `smartctl --scan-open`
        # misdetects as plain SCSI, so the exporter is pinned to `-d sat` and
        # would answer with temperature 0 and no ATA attributes otherwise. Both
        # exporters label disks by kernel name; the relabeling below adds the
        # physical bay so panels and alerts can name the disk the way the QNAP
        # UI does.
        - job_name: nas-node
          scrape_interval: 60s
          scrape_timeout: 30s
          static_configs:
            - targets: ["192.168.3.216:9100"]
              labels:
                nas: NAS33657A
        - job_name: nas-smartctl
          scrape_interval: 60s
          scrape_timeout: 30s
          static_configs:
            - targets: ["192.168.3.216:9633"]
              labels:
                nas: NAS33657A
          metric_relabel_configs:
            - source_labels: [device]
              regex: sda
              target_label: disk
              replacement: bay3
            - source_labels: [device]
              regex: sdb
              target_label: disk
              replacement: bay4
            - source_labels: [device]
              regex: sdc
              target_label: disk
              replacement: bay1
            - source_labels: [device]
              regex: sdd
              target_label: disk
              replacement: bay2
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 30Gi
      resources:
        requests:
          cpu: 160m
          memory: 3968Mi
        limits:
          memory: 5Gi
    ingress:
      enabled: true
      ingressClassName: tailscale
      annotations:
        tailscale.com/proxy-group: ingress-proxies
      hosts:
        - prometheus.west-beta.ts.net
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - prometheus.west-beta.ts.net
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 1m
          memory: 25Mi
        limits:
          memory: 50Mi
  alertmanager:
    # IPv4/IPv6 双栈（同上：enabled 是门，ipFamilies 必须 IPv4 在前）
    service:
      ipDualStack:
        enabled: true
        ipFamilies: ["IPv4", "IPv6"]
        ipFamilyPolicy: PreferDualStack
    alertmanagerSpec:
      containers:
        - name: ntfy-relay
          image: ghcr.io/khuedoan/webhook-transformer:v0.0.3
          args:
            - --port=8081
            - --config=/config/alertmanager-to-ntfy.jsonnet
            - --upstream-host=https://ntfy.sh
          envFrom:
            - secretRef:
                name: webhook-transformer
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: webhook-transformer
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Mi
      resources:
        requests:
          cpu: 2m
          memory: 35Mi
        limits:
          memory: 70Mi
    config:
      route:
        receiver: ntfy
        group_by:
          - namespace
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          - receiver: "robusta"
            group_by: ["..."]
            group_wait: 1s
            group_interval: 1s
            matchers:
              - severity =~ ".*"
            continue: true
          - receiver: ntfy
            matchers:
              - alertname = "Watchdog"
      receivers:
        - name: ntfy
          webhook_configs:
            - url: http://localhost:8081
              send_resolved: true
        - name: "robusta"
          webhook_configs:
            - url: "http://robusta-runner.default.svc.cluster.local/api/alerts"
              send_resolved: true
    ingress:
      enabled: true
      ingressClassName: tailscale
      annotations:
        tailscale.com/proxy-group: ingress-proxies
      hosts:
        - alertmanager.west-beta.ts.net
      paths:
        - /
      pathType: Prefix
      tls:
        - hosts:
            - alertmanager.west-beta.ts.net

    prometheusConfigReloader:
      resources:
        requests:
          cpu: 1m
          memory: 21Mi
        limits:
          memory: 42Mi
  defaultRules:
    rules:
      kubeProxy: false
  kubeApiServer:
    enabled: true
  kubeControllerManager:
    enabled: true
    # TODO: fix hardcoded IPs
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
  kubeScheduler:
    enabled: true
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
  kubeProxy:
    enabled: false
  kubeEtcd:
    enabled: true
    endpoints:
      - 192.168.3.226
      - 192.168.3.174
      - 192.168.3.158
    service:
      enabled: true
      port: 2381
      targetPort: 2381
  prometheusOperator:
    resources:
      requests:
        cpu: 3m
        memory: 107Mi
      limits:
        memory: 214Mi
  kubeStateMetrics:
    resources:
      requests:
        cpu: 5m
        memory: 42Mi
      limits:
        memory: 84Mi
  nodeExporter:
    resources:
      requests:
        cpu: 5m
        memory: 39Mi
      limits:
        memory: 80Mi
prometheus-smartctl-exporter:
  common:
    config:
      # Use a wrapper that only retries the known NVMe error-log bug.
      # Some drives (e.g. ZHITAI TiPro7000) fail with PRP Offset Invalid when
      # smartmontools reads the default 16 error-log entries; the wrapper
      # retries with --log=error,64 only for that specific failure.
      smartctl_location: /opt/smartctl-wrapper/smartctl
  extraVolumes:
    - name: smartctl-wrapper
      configMap:
        name: smartctl-wrapper
        defaultMode: 0755
  extraVolumeMounts:
    - name: smartctl-wrapper
      mountPath: /opt/smartctl-wrapper
  serviceMonitor:
    enabled: true
    interval: 60s
    scrapeTimeout: 30s
    # Add node hostname / node IP labels to every smartctl metric, so Grafana
    # panels and alert annotations no longer show only the exporter Pod IP.
    relabelings:
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_node_name
        targetLabel: node
      - action: replace
        sourceLabels:
          - __meta_kubernetes_pod_host_ip
        targetLabel: node_ip
  prometheusRules:
    enabled: true
    rules:
      smartCTLDeviceMediaErrors:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} has media errors'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) has media errors'
      smartCTLDeviceCriticalWarning:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} has critical controller warnings'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) has critical controller warnings'
      smartCTLDeviceAvailableSpareUnderThreshold:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} is under available spare threshold'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) is under available spare threshold'
      smartCTLDeviceStatus:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} has bad status'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) has bad status'
      smartCTLDInterfaceSlow:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} interface is slower than it should be'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) interface is slower than it should be'
      smartCTLDDeviceTemperature:
        annotations:
          summary: '[{{ $labels.node }}] Device {{ $labels.device }} temperature higher than 60°C'
          description: 'Device {{ $labels.device }} on node {{ $labels.node }} ({{ $labels.node_ip }}) has temperature higher than 60°C'
  rbac:
    # The chart default RoleBinding references the unrestricted-psp ClusterRole,
    # which is not guaranteed to exist on modern K3s. The exporter does not need
    # Kubernetes API access, so RBAC is disabled.
    create: false
  service:
    port: 9633
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 64Mi
