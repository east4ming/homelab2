# kor：集群内未使用资源（orphaned resources）发现工具。
#
# 以 Prometheus exporter 形态常驻运行，暴露 kubernetes_orphaned_resources
# 指标（标签 kind / namespace / resourceName），由 monitoring-system 的
# Prometheus 抓取；dashboard 见
# system/monitoring-system/files/dashboards/kor.json。
kor:
  # 不跑 CronJob：仓库内没有 Slack 凭据，CronJob 的报告只能落在 Pod 日志里；
  # exporter 每 exporterInterval 分钟重扫一次，结果在 Grafana 里持续可见。
  cronJob:
    enabled: false
  prometheusExporter:
    # 单位分钟。图表默认 10 分钟，而每轮都是对整个集群的全量 LIST，
    # 对 4 节点 homelab 偏频繁，放慢到 30 分钟。
    exporterInterval: "30"
    # 覆盖图表的默认 args（默认就是 [exporter]，覆盖时必须带上它）。
    #
    # 两个 --exclude-labels 都是为了把「实际在用、但 kor 看不到引用」的东西
    # 挡在报告之外（kor 只判断有没有 Pod 挂载/引用，看不到被 CR、Ingress、
    # sidecar、operator 按名字使用的情况）：
    #
    #   app.kubernetes.io/managed-by=Helm
    #     声明式对象由 Git 管理，不该按 Pod 使用情况判定。**代价已知**：ReplicaSet
    #     会从 Pod 模板继承这个标签，最新的 486 个旧 RS 里有 105 个会一起从报告里
    #     消失。集群级 CRD 同样会被过滤（见下）。
    #
    #   tailscale.com/managed=true
    #     Tailscale operator 管理的 Secret（21 张 Ingress 证书 + 8 个 ProxyGroup/
    #     operator 状态）。这批对象无法用 kor/used=true 排除——operator 会重写
    #     Secret 元数据把外部标签冲掉（已实测）。
    #
    # 注意 CRD 的过滤器只在 exporter/all 路径生效：processCrds 有两个调用者，
    # pkg/kor/all.go 的 getUnusedCrds 会传入真实 filterOpts，而 pkg/kor/crds.go
    # 的 GetUnusedCrds（独立子命令 kor customresourcedefinition 走这条）把它丢弃、
    # 改用空 Options。所以用子命令去验证会得到相反结论——别用它排查本配置。
    args:
      - exporter
      - --exclude-labels
      - app.kubernetes.io/managed-by=Helm
      - --exclude-labels
      - tailscale.com/managed=true
    deployment:
      image:
        # 图表默认 latest + imagePullPolicy=Always，无法追溯版本；
        # 钉住 chart 0.2.16 对应的 appVersion，缓存里有就不再回源拉取。
        tag: v0.6.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
    serviceMonitor:
      enabled: true
  # 上游 chart 的默认规则表里**没有 nodes 与 csidrivers**，缺了会让 kor 的
  # VolumeAttachment 分析全部误判：它逐个查 VA 引用的节点，权限不足时 Get 失败，
  # 于是每条 VA 都被报成「Node xxx does not exist」（实测 25 条全是这么来的，
  # 而这些 VA 的 PV 与节点其实都存在，属活跃挂载——照报告删会触发卷 detach）。
  #
  # 本列表 = 上游 chart 0.2.16 的 values.yaml 默认值 + nodes / csidrivers 两项。
  # 升级 chart 时必须对照上游默认值复核这份表（charts 的 rbac.rules 是整体覆盖，
  # 不是追加）。
  rbac:
    create: true
    rules:
      - apiGroups: [""]
        resources: ["pods", "configmaps", "secrets", "services", "serviceaccounts", "persistentvolumeclaims", "endpoints", "namespaces", "persistentvolumes", "nodes"]
      - apiGroups: ["apps"]
        resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
      - apiGroups: ["networking.k8s.io"]
        resources: ["ingresses", "networkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
      - apiGroups: ["autoscaling"]
        resources: ["horizontalpodautoscalers"]
      - apiGroups: ["policy"]
        resources: ["poddisruptionbudgets"]
      - apiGroups: ["batch"]
        resources: ["jobs"]
      - apiGroups: ["discovery.k8s.io"]
        resources: ["endpointslices"]
      - apiGroups: ["storage.k8s.io"]
        resources: ["storageclasses", "volumeattachments", "csidrivers"]
      - apiGroups: ["scheduling.k8s.io"]
        resources: ["priorityclasses"]
      - apiGroups: ["apiextensions.k8s.io"]
        resources: ["customresourcedefinitions"]
