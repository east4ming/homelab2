argo-cd:
  global:
    domain: argocd.west-beta.ts.net
    networkPolicy:
      create: false
    logging:
      # -- Set the global logging level. One of: `debug`, `info`, `warn` or `error`
      level: warn
  configs:
    params:
      server.insecure: true
      controller.diff.server.side: true
    cm:
      resource.ignoreResourceUpdatesEnabled: true
      resource.customizations.ignoreResourceUpdates.all: |
        jsonPointers:
          - /status
      accounts.holmesgptuser: apiKey, login
    rbac:
      policy.default: role:readonly
      policy.csv: |
        p, role:admin, *, *, *, allow
        p, role:admin, accounts, apiKey, *, allow
        p, holmesgpt, accounts, apiKey, holmesgpt, allow
        p, holmesgpt, projects, get, *, allow
        p, holmesgpt, applications, get, *, allow
        p, holmesgpt, repositories, get, *, allow
        p, holmesgpt, clusters, get, *, allow
        p, holmesgpt, applications, manifests, */*, allow
        p, holmesgpt, applications, resources, */*, allow
        g, admin, role:admin
        g, holmesgptuser, role:holmesgpt
  server:
    ingress:
      enabled: true
      ingressClassName: tailscale
      tls: true
      annotations:
        tailscale.com/proxy-group: ingress-proxies
    env:
      - name: GOMEMLIMIT
        value: "450MiB"
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    metrics: &metrics
      enabled: true
      serviceMonitor:
        enabled: true
  dex:
    enabled: false
  controller:
    env:
      # Split large application trees into multiple Redis keys to reduce controller<->Redis traffic
      # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/#argocd-application-controller
      - name: ARGOCD_APPLICATION_TREE_SHARD_SIZE
        value: "100"
      # Force Go GC before the k8s memory limit to mitigate OOMKilled on memory spikes (~88% of limit)
      # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/#mitigating-oomkilled-events-from-memory-spikes
      - name: GOMEMLIMIT
        value: "900MiB"
    resources:
      requests:
        cpu: 150m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      rules:
        enabled: true
        spec:
          - alert: ArgoAppMissing
            expr: |
              absent(argocd_app_info) == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "[Argo CD] No reported applications"
              description: >
                Argo CD has not reported any applications data for the past 15 minutes which
                means that it must be down or not functioning properly.  This needs to be
                resolved for this cloud to continue to maintain state.
          - alert: ArgoAppNotSynced
            expr: |
              argocd_app_info{sync_status!="Synced"} == 1
            for: 12h
            labels:
              severity: warning
            annotations:
              summary: "[{{ $labels.name }}] Application not synchronized"
              description: >
                The application [{{ $labels.name }}] has not been synchronized for over
                12 hours which means that the state of this cloud has drifted away from the
                state inside Git.
  repoServer:
    env:
      - name: GOMEMLIMIT
        value: "450MiB"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    metrics: *metrics
  redis:
    metrics: *metrics
    image:
      repository: docker.io/redis
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  applicationSet:
    metrics: *metrics
    extraEnv:
      - name: GOMEMLIMIT
        value: "220MiB"
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  notifications:
    metrics: *metrics
    extraEnv:
      - name: GOMEMLIMIT
        value: "220MiB"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
argocd-apps:
  applicationsets:
    root:
      namespace: argocd
      generators:
        - git:
            # TODO:
            repoURL: &repoURL http://gitea-http.gitea:3000/ops/homelab2
            # Use fully qualified git references: avoids iterating through all refs
            # when resolving short names (perf win on the repo-server).
            # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/#use-fully-qualified-git-references
            revision: &revision refs/heads/master
            # Reduce git-generator polling: default is 180s, each requeue triggers a
            # git ls-remote against the repo (observed ~7000 ls-remote calls / 30d).
            # 10m detection latency is fine for a homelab.
            requeueAfterSeconds: 600
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
      # Ref https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Controlling-Resource-Modification/#allow-temporarily-toggling-auto-sync
      ignoreApplicationDifferences:
        - jsonPointers:
            - /spec/syncPolicy
      template:
        metadata:
          name: "{{path.basename}}"
          annotations:
            # Manifest Paths Annotation: every app only consumes its own directory
            # (no cross-dir refs exist in this repo), so a commit touching one path
            # must not invalidate the manifest cache / trigger refreshes of all 35 apps.
            # "." resolves to the app's source path (i.e. its own directory).
            # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/high_availability/#manifest-paths-annotation
            # NOTE: keep a FULL clone for this repo (no `depth` on the repo secret) —
            # shallow clones skip the non-webhook Git-history comparison this
            # annotation relies on, and no webhooks are configured for gitea.
            argocd.argoproj.io/manifest-generate-paths: "."
        spec:
          destination:
            name: in-cluster
            namespace: "{{path.basename}}"
          project: default # TODO
          source:
            repoURL: *repoURL
            path: "{{path}}"
            targetRevision: *revision
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
            retry:
              limit: 10
              backoff:
                duration: 1m
                factor: 2
                maxDuration: 16m
            syncOptions:
              - CreateNamespace=true
              - ApplyOutOfSyncOnly=true
              - ServerSideApply=true
            managedNamespaceMetadata:
              annotations:
                # Enable privileged VolSync movers by default for all namespaces
                # TODO this may be refactored in the future for finer granularity
                # See also https://volsync.readthedocs.io/en/stable/usage/permissionmodel.html
                volsync.backube/privileged-movers: "true"
          ignoreDifferences:
            - kind: Service
              jsonPointers:
                - /spec/externalName
