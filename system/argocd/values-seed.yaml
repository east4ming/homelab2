argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
argocd-apps:
  applicationsets:
    root:
      generators:
        - git:
            repoURL: &repoURL https://github.com/east4ming/homelab2
            # Use fully qualified git references (perf win on the repo-server)
            revision: &revision refs/heads/master
            requeueAfterSeconds: 600
            directories:
              - path: system/*
              - path: platform/*
              - path: apps/*
      template:
        metadata:
          annotations:
            # Only refresh apps whose own directory changed
            argocd.argoproj.io/manifest-generate-paths: "."
        spec:
          source:
            repoURL: *repoURL
            targetRevision: *revision
