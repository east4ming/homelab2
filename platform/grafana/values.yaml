grafana:
  # Hardcoded password because of ArgoCD's behavior
  # TODO:
  adminPassword: crse4zLTjCrds8PxdOlTRgcs2jh4QP1AgNM350IG
  ingress:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: ingress-proxies
    hosts:
      - &host grafana.west-beta.ts.net
    tls:
      - hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
    plugins:
      enabled: true
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
  # Only ever existed in the live StatefulSet (added out-of-band), which ArgoCD's
  # server-side apply does not prune because the list item is not in the manifest.
  # Declared here so Git is the source of truth; the plugin is already installed on
  # the persistent volume, so this only matters for a fresh volume.
  env:
    GF_INSTALL_PLUGINS: performancecopilot-pcp-app
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.west-beta.ts.net
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      auto_assign_org_role: Admin
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.west-beta.ts.net/auth
      token_url: https://dex.west-beta.ts.net/token
      api_url: https://dex.west-beta.ts.net/userinfo
    feature_toggles:
      provisioning: true
      kubernetesClientDashboardsFolders: true
      kubernetesDashboards: true
      grafanaAPIServerEnsureKubectlAccess: true
      sqlExpressions: true
      queryLibrary: true
      logsPanelControls: true
      interactiveLearning: true
      grafanaAdvisor: true
    rendering:
      server_url: http://grafana-image-renderer:8081/render
      callback_url: http://localhost:3000/
  persistence:
    enabled: true
    size: 1200Mi
  useStatefulSet: true
  serviceMonitor:
    enabled: true
  # Grafana 13 (unified storage + kubernetesDashboards + git sync) idles at ~460Mi
  # RSS, so the old 512Mi limit had no room for the memory spike every dashboard
  # provisioning reload causes -> repeated OOMKilled when dashboards are added.
  # 1Gi is about 2x the observed peak. GOMEMLIMIT is derived from the limit by the
  # chart (0.9x).
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 1Gi
  imageRenderer:
    networkPolicy:
      limitIngress: false
    enabled: true
