grafana:
  # Admin credential comes from the ExternalSecret in templates/secret.yaml
  # (store key grafana.admin, generated by platform/global-secrets).
  admin:
    existingSecret: grafana-secrets
    userKey: admin-user
    passwordKey: admin-password
  # ⚠️ 一次性脚手架（轮换完成后立刻删除，见 PR 说明）：
  # Grafana 只在数据库首次初始化时读取 GF_SECURITY_ADMIN_PASSWORD，库已存在时换
  # env 不会改掉库里的口令 —— #533 的口令因此还是公开过的那个。这里在 Pod 启动
  # （主容器之前）把库里的 admin 口令对齐到 grafana-secrets 的值。
  #
  # 用 initContainer 而不是 Job：SQLite 库在 RWO PVC 上，只有同一个 Pod 才能和主
  # 容器同时挂载它。chart 的 init-chown-data 先执行（把卷 chown 给 472），本容器
  # 随后以 472 运行。
  #
  # distroless 镜像没有 shell，只能直接调 grafana 二进制；口令用 kubelet 的
  # $(VAR) 展开（能读该命名空间 Pod/Secret 的人本来就能看到这个值）。
  extraInitContainers:
    - name: align-admin-password
      image: docker.io/grafana/grafana:13.2.3-distroless # = chart appVersion-distroless
      command: ["/usr/share/grafana/bin/grafana"]
      args:
        - cli
        - --homepath=/usr/share/grafana
        - admin
        - reset-admin-password
        - $(GF_SECURITY_ADMIN_PASSWORD)
      env:
        - name: GF_PATHS_DATA
          value: /var/lib/grafana
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: admin-password
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
      volumeMounts:
        - name: storage
          mountPath: /var/lib/grafana
  # IPv4/IPv6 双栈（chart 的 templates/service.yaml 读 service.ipFamilyPolicy）
  service:
    ipFamilyPolicy: PreferDualStack
  ingress:
    enabled: true
    ingressClassName: tailscale
    annotations:
      tailscale.com/proxy-group: ingress-proxies
    hosts:
      - &host grafana.west-beta.ts.net
    tls:
      - hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
    plugins:
      enabled: true
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 512Mi
  # Only ever existed in the live StatefulSet (added out-of-band), which ArgoCD's
  # server-side apply does not prune because the list item is not in the manifest.
  # Declared here so Git is the source of truth; the plugin is already installed on
  # the persistent volume, so this only matters for a fresh volume.
  env:
    GF_INSTALL_PLUGINS: performancecopilot-pcp-app
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.west-beta.ts.net
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      auto_assign_org_role: Admin
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.west-beta.ts.net/auth
      token_url: https://dex.west-beta.ts.net/token
      api_url: https://dex.west-beta.ts.net/userinfo
    feature_toggles:
      provisioning: true
      kubernetesClientDashboardsFolders: true
      kubernetesDashboards: true
      grafanaAPIServerEnsureKubectlAccess: true
      sqlExpressions: true
      queryLibrary: true
      logsPanelControls: true
      interactiveLearning: true
      grafanaAdvisor: true
    rendering:
      server_url: http://grafana-image-renderer:8081/render
      callback_url: http://localhost:3000/
  persistence:
    enabled: true
    size: 1200Mi
  useStatefulSet: true
  serviceMonitor:
    enabled: true
  # Grafana 13 (unified storage + kubernetesDashboards + git sync) idles at ~460Mi
  # RSS, so the old 512Mi limit had no room for the memory spike every dashboard
  # provisioning reload causes -> repeated OOMKilled when dashboards are added.
  # 1Gi is about 2x the observed peak. GOMEMLIMIT is derived from the limit by the
  # chart (0.9x).
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 1Gi
  imageRenderer:
    networkPolicy:
      limitIngress: false
    enabled: true
