apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets
  namespace: {{ .Release.Namespace }}
spec:
  # The admin credential is generated by the global-secrets secret-generator
  # (platform/global-secrets/files/secret-generator/config.yaml ->
  # secret grafana.admin) and never stored in Git: the generator only fills in
  # missing keys, so the value is stable once created.
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: grafana-secrets
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: {{` "{{ .admin_password }}" `}}
        GRAFANA_SSO_CLIENT_SECRET: {{` "{{ .sso_client_secret }}" `}}
  data:
    - secretKey: admin_password
      remoteRef:
        key: grafana.admin
        property: password
    - secretKey: sso_client_secret
      remoteRef:
        key: dex.grafana
        property: client_secret
