# 开发工具与版本（非 Python 部分）
# Python 解释器/依赖由 uv 管理，见 pyproject.toml 与 uv.lock。
[tools]
argocd = "3.5.6"
dyff = "1.12.0"
go = "1.26.10"
gotestsum = "1.13.0"
helm = "3.20.2"
jq = "1.8.2"
k3d = "5.9.0"
k9s = "0.51.0"
kubectl = "1.36.6"
kustomize = "5.8.3"
neovim = "0.12.6"
opentofu = "1.11.14"
shellcheck = "0.11.0"

[env]
_.path = ["bin", ".venv/bin"]

[tasks.setup]
description = "安装 mise 工具并同步 uv 依赖"
run = """
mise install --yes
uv sync --all-groups
"""
