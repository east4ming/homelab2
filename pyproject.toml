[project]
name = "homelab2"
version = "0.0.0"
description = "Homelab2 开发脚本与文档工具链"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
scripts = [
  "jinja2>=3.1",
  "kubernetes>=30",
  "netaddr>=1.3",
  "pexpect>=4.9",
  "requests>=2.31",
  "rich>=13",
]
dev = [
  "ansible>=14.5,<15",
  "ansible-lint>=26,<27",
  "pre-commit>=4.5,<5",
  "yamllint>=1.37",
]
# CI 只需要 ansible-core（不跑 playbook/collections）与 pre-commit
ci = [
  "ansible-core>=2.21,<2.22",
  "pre-commit>=4.5,<5",
]
docs = [
  "babel==2.18.0",
  "certifi==2026.10.23",
  "charset-normalizer==3.5.2",
  "click==8.5.0",
  "colorama==0.4.6",
  "ghp-import==2.1.0",
  "idna==3.20",
  "Jinja2==3.1.6",
  "Markdown==3.11.2",
  "MarkupSafe==3.0.4",
  "mergedeep==1.3.4",
  "mkdocs==1.6.1",
  "mkdocs-get-deps==0.2.2",
  "mkdocs-material==9.7.7",
  "mkdocs-material-extensions==1.3.1",
  "packaging==26.3",
  "paginate==0.5.7",
  "pathspec==1.1.1",
  "platformdirs==4.13.5",
  "Pygments==2.21.0",
  "pymdown-extensions==12.3",
  "python-dateutil==3.0.0",
  "PyYAML==6.0.3",
  "pyyaml_env_tag==1.1",
  "regex==2026.9.29",
  "requests==2.34.2",
  "six==1.17.0",
  "urllib3==2.8.0",
  "watchdog==6.0.0",
]

[tool.uv]
package = false
