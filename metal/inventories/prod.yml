all:
  vars:
    control_plane_endpoint: 192.168.3.100
    load_balancer_ip_pool:
      - 192.168.3.32/27
    # ── IPv4/IPv6 双栈地址规划（2026-10-07 实施，与集群实际生效值一致）──────────
    # 站点 ULA（RFC 4193，随机 40-bit global ID）：fdb5:92d0:b067::/48
    # ⚠️ k3s 的 cluster-cidr 与 Cilium 的 clusterPoolIPv6PodCIDRList 必须是同一个池，
    #    故只在此处定义一份，两个 role 共同引用。
    dualstack_ipv6_pod_cidr: "fdb5:92d0:b067:4200::/56"       # Pod IPv6（每节点 /64）
    dualstack_ipv6_service_cidr: "fdb5:92d0:b067:4300::/112"  # Service IPv6
    ntp_server: "ntp.ubuntu.com"
  # cluster.yml / boot.yml 里有 hosts: localhost 的 play（guard、cilium、tailscale、
  # pxe_server）。显式声明它，避免依赖 implicit localhost —— 否则限流/审计类工具
  # （如 --limit localhost）会因为 inventory 里查不到该 host 而拒绝执行。
  hosts:
    localhost:
      ansible_connection: local
# ⚠️ 真实值不在本文件，也不在仓库里：
#   - registries_config_yaml（节点 /etc/rancher/k3s/registries.yaml 的整份内容）
#   - tailscale_auth_key / tailscale_client_id / tailscale_client_secret
#   - 各节点的 mac（PXE / Wake-on-LAN）
# 它们由 metal/inventories/group_vars/all/zz-secrets.yml 提供（本地文件，已 gitignore，
# 示例见同目录 zz-secrets.yml.example）。未提供时 play 会在写任何配置之前 fail。
# 说明见 metal/README.md「操作者必须提供的值」。
metal:
  children:
    masters:
      hosts:
        n100-jumper-0:
          ansible_host: 192.168.3.226
          mac: "{{ metal_macs['n100-jumper-0'] }}"
          disk: nvme0n1
          network_interface: enp3s0
        n100-jumper-1:
          ansible_host: 192.168.3.174
          mac: "{{ metal_macs['n100-jumper-1'] }}"
          disk: nvme0n1
          network_interface: enp3s0
        n100-jumper-2:
          ansible_host: 192.168.3.158
          mac: "{{ metal_macs['n100-jumper-2'] }}"
          disk: nvme0n1
          network_interface: enp3s0
    workers:
      hosts:
        n100-cheshi-0:
          ansible_host: 192.168.3.154
          mac: "{{ metal_macs['n100-cheshi-0'] }}"
          disk: nvme0n1
          network_interface: enp2s0
