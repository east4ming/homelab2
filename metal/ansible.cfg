[defaults]
# host_key_checking 保持 ansible 默认（True）。这里【不要】写 false：
# 本仓库的 metal play 带 become: true，关掉主机密钥校验等于允许 MITM 直接拿到 root
# （CWE-295）。首次连接新节点请用带外渠道核对指纹后再写入 known_hosts：
#   ssh-keyscan -t ed25519 <host> >> ~/.ssh/known_hosts
stdout_callback=debug
stderr_callback=debug
force_color=true

[ssh_connection]
# 复用 SSH 连接，明显加快 4 台节点上的多任务执行。
pipelining=True
