- name: Enforce minimum Ansible version
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.14', '>=')
    msg: "Minimum ansible-core version required is 2.14"

- name: Install Dependent Ubuntu Packages
  when: ansible_distribution in ['Ubuntu']
  ansible.builtin.apt:
    name:
      - policycoreutils  # Used by install script to restore SELinux context
      - smartmontools    # Provides smartctl for disk SMART monitoring
    update_cache: true

# Write to /etc/sysctl.d instead of the module default (/etc/sysctl.conf):
# Ubuntu 26.04's procps marks /etc/sysctl.conf remove-on-upgrade, so the
# upgrade deleted it and silently dropped these values
# (fs.inotify.max_user_instances back to 128 breaks fwupd).
- name: Adjust kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-homelab-prerequisites.conf
  loop:
    - {name: "fs.inotify.max_queued_events", value: 16384}
    - {name: "fs.inotify.max_user_instances", value: 8192}
    - {name: "fs.inotify.max_user_watches", value: 524288}
  tags: sysctl

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/90-homelab-prerequisites.conf
  tags: sysctl

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/90-homelab-prerequisites.conf
  when: ansible_all_ipv6_addresses
  tags: sysctl

- name: Enable IPv6 router advertisements
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.accept_ra
    value: "2"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/90-homelab-prerequisites.conf
  tags: sysctl

# api_port / cluster_cidr / service_cidr / server_group / agent_group 定义在
# group_vars/all.yml。这里显式 assert，而不是让它们在模板渲染时以 undefined variable
# 的面目炸开：那既看不出是配置缺失，也会在放到一半防火墙规则之后才失败。
- name: Assert cluster addressing variables are usable
  ansible.builtin.assert:
    that:
      - api_port | int > 0
      - cluster_cidr is string and cluster_cidr | length > 0
      - service_cidr is string and service_cidr | length > 0
      - server_group in groups
      - agent_group in groups
    fail_msg: >-
      api_port / cluster_cidr / service_cidr / server_group / agent_group 必须在
      group_vars/all.yml 里有定义且可用。检查 metal/group_vars/all.yml 与
      metal/inventories/{{ inventory_file | basename }} 的组名是否一致。
    quiet: true
  run_once: true
  tags: firewall

- name: Populate service facts
  ansible.builtin.service_facts:
  tags: firewall

# ── UFW ───────────────────────────────────────────────────────────────────────
# 注意两个曾经让整块永不执行的坑（#531）：
#   1) systemd 下 service_facts 的键是 `ufw.service`，不是 `ufw`
#   2) `ufw status` 的实际输出是 `Status: active`，不是 `Status':' active`
- name: Allow UFW Exceptions
  when:
    - ansible_facts.services['ufw.service'] is defined
    - ansible_facts.services['ufw.service'].state == 'running'
  block:
    - name: Get ufw status
      ansible.builtin.command:
        cmd: ufw status
      changed_when: false
      register: ufw_status

    - name: If ufw enabled, open api port
      when:
        # ⚠️ 不能用 is search('active')：'inactive' 也含 'active'。
        # 只比较 status 行冒号后的一个词，字面量里不带冒号（避免 YAML/Jinja 歧义）。
        - ufw_status['stdout_lines'] | default([]) | first | default('')
          | split('Status:') | last | trim == "active"
      community.general.ufw:
        rule: allow
        port: "{{ api_port }}"
        proto: tcp

    - name: If ufw enabled, open etcd ports
      when:
        # ⚠️ 不能用 is search('active')：'inactive' 也含 'active'。
        # 只比较 status 行冒号后的一个词，字面量里不带冒号（避免 YAML/Jinja 歧义）。
        - ufw_status['stdout_lines'] | default([]) | first | default('')
          | split('Status:') | last | trim == "active"
        - groups[server_group] | length > 1
      community.general.ufw:
        rule: allow
        port: "2379:2381"
        proto: tcp

    - name: If ufw enabled, allow default CIDRs
      when:
        # ⚠️ 不能用 is search('active')：'inactive' 也含 'active'。
        # 只比较 status 行冒号后的一个词，字面量里不带冒号（避免 YAML/Jinja 歧义）。
        - ufw_status['stdout_lines'] | default([]) | first | default('')
          | split('Status:') | last | trim == "active"
      community.general.ufw:
        rule: allow
        src: "{{ item }}"
      loop: "{{ [cluster_cidr, service_cidr] | map('split', ',') | flatten }}"

- name: Allow Firewalld Exceptions
  when:
    - ansible_facts.services['firewalld.service'] is defined
    - ansible_facts.services['firewalld.service'].state == 'running'
  block:
    - name: If firewalld enabled, open api port
      ansible.posix.firewalld:
        port: "{{ api_port }}/tcp"
        zone: internal
        state: enabled
        permanent: true
        immediate: true

    - name: If firewalld enabled, open etcd ports
      when: groups[server_group] | length > 1
      ansible.posix.firewalld:
        port: "2379-2381/tcp"
        zone: internal
        state: enabled
        permanent: true
        immediate: true

    - name: If firewalld enabled, open inter-node ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        zone: internal
        state: enabled
        permanent: true
        immediate: true
      loop:
        - 5001/tcp   # Spegel (Embedded distributed registry)
        - 8472/udp   # Flannel VXLAN
        - 10250/tcp  # Kubelet metrics
        - 51820/udp  # Flannel Wireguard (IPv4)
        - 51821/udp  # Flannel Wireguard (IPv6)

    - name: If firewalld enabled, allow node CIDRs
      ansible.posix.firewalld:
        source: "{{ item }}"
        zone: internal
        state: enabled
        permanent: true
        immediate: true
      loop: >-
        {{
          (
            groups[server_group] | default([])
            + groups[agent_group] | default([])
          )
          | map('extract', hostvars, ['ansible_default_ipv4', 'address'])
          | flatten | unique | list
        }}

    - name: If firewalld enabled, allow default CIDRs
      ansible.posix.firewalld:
        source: "{{ item }}"
        zone: trusted
        state: enabled
        permanent: true
        immediate: true
      loop: "{{ [cluster_cidr, service_cidr] | map('split', ',') | flatten }}"

- name: Check for Apparmor existence
  ansible.builtin.stat:
    path: /sys/module/apparmor/parameters/enabled
  register: apparmor_enabled

- name: Check if Apparmor is enabled
  when: apparmor_enabled.stat.exists
  ansible.builtin.command: cat /sys/module/apparmor/parameters/enabled
  register: apparmor_status
  changed_when: false

- name: Gather the package facts
  ansible.builtin.package_facts:
    manager: auto

# Iptables v1.8.0-1.8.4 have a specific bug with K3s. https://github.com/k3s-io/k3s/issues/3117
- name: If iptables v1.8.0-1.8.4, warn user  # noqa ignore-errors
  when:
    - ansible_facts.packages['iptables'] is defined
    - ansible_facts.packages['iptables'][0]['version'] is version('1.8.5', '<')
    - ansible_facts.packages['iptables'][0]['version'] is version('1.7.9', '>')
  ansible.builtin.fail:
    msg:
      - "Warning: Iptables {{ ansible_facts.packages['iptables'][0]['version'] }} found."
      - "Add '--prefer-bundled-bin' to extra_server_args variable to use the bundled iptables binary."
  ignore_errors: true

- name: Configure Tailscale metrics service unit
  ansible.builtin.template:
    src: tailscale-metrics.service.j2
    dest: /etc/systemd/system/tailscale-metrics.service
    mode: "0644"
  notify:
    - Reload systemd units
    - Restart tailscale-metrics
  tags: tailscale

- name: Enable and start Tailscale metrics service
  ansible.builtin.systemd:
    name: tailscale-metrics
    enabled: true
    state: started
  tags: tailscale

- name: Setup optional private registry configuration
  when: registries_config_yaml is defined
  block:
    - name: Make k3s config directory
      ansible.builtin.file:
        path: "/etc/rancher/k3s"
        mode: "0755"
        state: directory
      tags: registries

    # 这道 assert 是 #530 最关键的一道闸：registries.yaml 是【整体覆盖】，
    # 拿占位内容跑一次就会抹掉节点上所有非 docker.io 镜像源与私有仓库认证。
    # 在写之前拒绝执行，并说明去哪里取真实内容。
    - name: Refuse to overwrite registries.yaml with placeholder content
      ansible.builtin.assert:
        that:
          - registries_config_yaml | length > 0
          - registries_config_yaml != metal_var_placeholder
          - (registries_config_yaml | from_yaml) is mapping
          - "'mirrors' in (registries_config_yaml | from_yaml)"
        fail_msg: >-
          registries_config_yaml 缺失、仍是占位值、或不是合法的 registries 配置
          （必须能解析成带 mirrors 键的 mapping）。它会被【整体覆盖】到节点
          /etc/rancher/k3s/registries.yaml —— 用占位内容执行会丢失线上全部
          registry mirror 与私有仓库认证。请把生产节点上的真实内容取回来填进
          metal/inventories/group_vars/all/zz-secrets.yml：
          ssh {{ ansible_user }}@{{ ansible_host }}
          'sudo cat /etc/rancher/k3s/registries.yaml'
        quiet: true
      tags: registries

    - name: Copy config values
      ansible.builtin.copy:
        content: "{{ registries_config_yaml }}"
        dest: "/etc/rancher/k3s/registries.yaml"
        mode: "0644"
      notify: Restart k3s
      tags: registries
