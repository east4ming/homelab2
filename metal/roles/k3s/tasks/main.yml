- name: Download k3s binary
  ansible.builtin.get_url:
    url: https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s
    checksum: sha256:https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-amd64.txt
    dest: "{{ role_path }}/files/bin/k3s"
    mode: "0755"
  delegate_to: localhost
  run_once: true
  register: k3s_binary
  tags: k3s-binary

# 二进制换了但配置没变时也走「Copy k3s config files → Restart k3s」这条链吗？
# 不会：get_url 的 checksum 决定重新下载只在 k3s_version 变化时发生，而版本变化
# 会同时改变 config.yaml 里的版本相关渲染与 unit 模板来源，config 任务必然 changed，
# 因此 restart 一定会被触发。为避免「每次跑都重启」，二进制本身不直接 notify。
- name: Copy k3s binary to nodes
  ansible.builtin.copy:
    src: bin/k3s
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  tags: k3s-binary

- name: Ensure config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /etc/rancher/node
    - "{{ k3s_data_dir }}/agent/pod-manifests"
  tags: k3s-config

# 节点交换内存：k3s 用 --config-dir 加载该目录，00-k3s-defaults.conf 每次启动由
# k3s 重写（含 memorySwap: {}），90-swap.conf 不会被覆盖。只设 failSwapOn=false
# 时工作负载仍是 NoSwap，必须显式设 swapBehavior。详见
# docs/how-to-guides/node-swap.md。
- name: Ensure kubelet config drop-in directory exists
  ansible.builtin.file:
    path: "{{ k3s_kubelet_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: k3s-config

- name: Configure kubelet node swap
  ansible.builtin.template:
    src: kubelet-swap.conf.j2
    dest: "{{ k3s_kubelet_config_dir }}/90-swap.conf"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s
  tags: k3s-config

- name: Check if k3s token file exists on the first node
  run_once: true
  ansible.builtin.stat:
    path: "{{ k3s_token_file }}"
  register: k3s_token_file_stat
  tags: k3s-token

# no_log：内容是集群 join token（等价于集群内凭证），不能让它在任务输出/失败
# dump 里出现（CWE-532）。
- name: Generate k3s token file on the first node if not exist yet
  run_once: true
  when: not k3s_token_file_stat.stat.exists
  ansible.builtin.copy:
    content: "{{ lookup('community.general.random_string', length=32) }}"
    dest: "{{ k3s_token_file }}"
    mode: "0600"
  no_log: true
  tags: k3s-token

- name: Get k3s token from the first node
  run_once: true
  ansible.builtin.slurp:
    src: "{{ k3s_token_file }}"
  register: k3s_token_base64
  no_log: true
  tags: k3s-token

- name: Ensure all nodes has the same token
  ansible.builtin.copy:
    content: "{{ k3s_token_base64.content | b64decode }}"
    dest: "{{ k3s_token_file }}"
    mode: "0600"
  no_log: true
  tags: k3s-token

# ── 双栈：导出本节点的 Tailscale IPv4/IPv6 与全局 IPv6（2026-10-07）─────────────
# 每个取地址的任务都必须 changed_when: false（只读查询），并且校验 stdout ——
# 否则 tailscaled 未就绪时会静默把 node-external-ip 写成空串。
- name: Get tailscale ipv4 address
  ansible.builtin.command:
    cmd: tailscale ip --4
  register: tailscale_ip
  changed_when: false
  failed_when: tailscale_ip.stdout is not match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$')
  tags: k3s-config

- name: Set fact tailscale_ipv4
  ansible.builtin.set_fact:
    tailscale_ipv4: "{{ tailscale_ip.stdout }}"
  tags: k3s-config

- name: Get tailscale ipv6 address
  ansible.builtin.command:
    cmd: tailscale ip --6
  register: tailscale_ip6
  changed_when: false
  failed_when: tailscale_ip6.stdout is not match('^[0-9a-fA-F:]+$')
  tags: k3s-config

- name: Set fact tailscale_ipv6
  ansible.builtin.set_fact:
    tailscale_ipv6: "{{ tailscale_ip6.stdout }}"
  tags: k3s-config

# node_ipv6 来自 inventory（站点 ULA，见 metal/inventories/prod.yml 的
# dualstack_ipv6_node_cidr）。2026-10-29 之前这里取的是 SLAAC 派生的 GUA：
# ISP 前缀一漂移，node-ip 就指向不存在的地址，kubelet 每 10s 报
# "failed to validate secondaryNodeIP"，Cilium 也装不出跨节点 IPv6 直连路由。
#
# 这里只做早期校验 —— 地址由 prerequisites 的 netplan 任务配置，必须早于 k3s 启动。
# 缺地址时不静默降级：降级会让 Node 的 IPv6 变成空或旧值，比直接失败更难排查。
- name: Read IPv6 addresses of the primary interface
  ansible.builtin.command:
    cmd: ip -6 addr show dev {{ network_interface }}
  register: k3s_node_ipv6_iface
  changed_when: false
  tags: k3s-config

- name: Assert node_ipv6 (site ULA) is configured on {{ network_interface }}
  ansible.builtin.assert:
    that:
      - node_ipv6 is defined
      - (node_ipv6 ~ '/') in k3s_node_ipv6_iface.stdout
    fail_msg: >-
      node_ipv6={{ node_ipv6 | default('undefined') }} 不在 {{ network_interface }} 上。
      先运行 prerequisites role（写 /etc/netplan/60-homelab-ula.yaml 并 netplan apply）。
    quiet: true
  tags: k3s-config

# unit 文件变化 → daemon-reload；config.yaml 变化 → 重启。两者都不变化则什么都不做。
- name: Copy k3s config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: config.yaml.j2
      dest: "{{ k3s_config_file }}"
    - src: k3s.service.j2
      dest: "{{ k3s_service_file }}"
  notify:
    - Reload systemd units
    - Restart k3s
  tags: k3s-config

- name: Copy kube-vip manifests
  when: "'masters' in group_names"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - src: kube-vip.yaml.j2
      dest: "{{ k3s_data_dir }}/agent/pod-manifests/kube-vip.yaml"
  notify: Restart k3s
  tags: k3s-config

- name: Enable k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started
  register: k3s_service
  until: k3s_service is succeeded
  retries: 5
  tags: k3s-service

# no_log：kubeconfig 是集群 admin 凭证。
- name: Get Kubernetes config file
  run_once: true
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_file }}"
  register: kubeconfig_base64
  no_log: true
  tags: kubeconfig

- name: Write Kubernetes config file with the correct cluster address
  ansible.builtin.copy:
    content: "{{ kubeconfig_base64.content | b64decode | replace('127.0.0.1', control_plane_endpoint) }}"
    dest: "{{ playbook_dir }}/kubeconfig.yaml"
    mode: "0600"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  delegate_to: localhost
  run_once: true
  no_log: true
  tags: kubeconfig
