---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress-proxies
spec:
  type: ingress
  replicas: 4
  # Expose client metrics on the shared ingress proxies (see proxyclass.yaml).
  proxyClass: tailscale-metrics
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: egress-proxies
spec:
  type: egress
  replicas: 4
  # Expose client metrics on the egress proxies as well.
  proxyClass: tailscale-metrics
